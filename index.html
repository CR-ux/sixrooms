<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>callie rose petal is ⁿᵒᵗBorges </title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e7e5e4;
      --muted: #a8a29e;
      --focus: #d6d3d1;
    }
    @font-face {
      font-family: 'Hamartia';
      src: url('./assets/fonts/Hamartia.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
      font-size: xx-large;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: "Hamartia", sans-serif;
      font-size: 225%;
      background: var(--bg);
      color: var(--fg);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }

    a {
      color: var(--focus); /* the lighter grey/stone variable you already set */
      font-weight: 500;
    }
    a:hover {
      color: #fff;
    }
    header { padding: 48px 0 16px; text-align: center; }
    header h1 {
      margin: 0;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    header h2 {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: lowercase;
    }

    nav.links {
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 5vw, 48px);
      margin: 24px auto 28px;
      padding: 10px 12px 12px;
      max-width: 100%;
    }



    /* Desktop: centered, no scroll */
    @media (min-width: 769px) {
      nav.links {
        justify-content: center;
        overflow-x: visible;
      }
    }

    .link {
      text-decoration: none;
      color: var(--fg);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 12px;
      outline: none;
    }
    .link span {
      margin-bottom: 4px;
      color: var(--muted);
    }

    .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 6px; }
    .link:hover { filter: brightness(1.08); }

    .bio { max-width: 500px; margin: 8px auto 64px; text-align: justify; text-align-last: center; padding: 0 12px; }
    .bio p { margin: 0; color: var(--fg); }

    footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 16px; }

    @media (prefers-reduced-motion: reduce) {
      .link:hover { filter: none; }
      .link, nav.links { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Callie Rose Petal</h1>
    </header>

    <section class="bio">
      <p>
        is a <a href="gallery.html">painter,</a> <a href="https://notborges.bandcamp.com">composer,</a> and <a href="https://notborges.pages.dev">occult researcher</a> in the Field of Lexicomythography — with an interdisciplinary focus on semiotics and conceptual systems.
      </p>
    <br>
    </section>




    <footer>
      &copy; <span id="y"></span> Callie Rose Petal
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
